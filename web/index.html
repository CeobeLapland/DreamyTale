<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>纸书智伴 · 本地演示</title>
<style>
  :root {
    --bg: #f6f6f4;
    --panel: #ffffff;
    --line: #e3e2dd;
    --ink: #23221f;
    --muted: #7c7a72;
    --accent: #2f6f5e;
    --accent-soft: #e8f1ee;
    --warn: #a8642a;
    --warn-soft: #fbf1e6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.6 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 20px; background: var(--panel);
    border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  .brand { font-weight: 600; letter-spacing: .3px; }
  .brand small { color: var(--muted); font-weight: 400; margin-left: 8px; }
  select, input, button {
    font: inherit; color: inherit; border: 1px solid var(--line);
    background: #fff; border-radius: 8px; padding: 6px 10px; outline: none;
  }
  select:focus, input:focus { border-color: var(--accent); }
  button { cursor: pointer; transition: .12s; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #28604f; color: #fff; }
  .spacer { flex: 1; }
  .meta { color: var(--muted); font-variant-numeric: tabular-nums; }

  main { flex: 1; display: flex; min-height: 0; }

  .stage-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 20px; min-width: 0; min-height: 0; overflow: hidden;
    background: #efeeea;
  }
  .stage {
    position: relative; background: #fff; border-radius: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,.09); overflow: hidden;
    display: inline-block; max-width: 100%;
  }
  .stage img {
    display: block; width: auto; height: auto;
    max-width: 100%; max-height: calc(100vh - 196px);
  }
  .bbox {
    position: absolute; border: 2px solid var(--accent);
    background: rgba(47,111,94,.13); border-radius: 4px;
    animation: pop .3s ease-out; pointer-events: none;
  }
  @keyframes pop { from { transform: scale(.94); opacity: 0 } to { transform: scale(1); opacity: 1 } }

  .subtitle {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    max-width: 86%; padding: 7px 14px; border-radius: 8px;
    background: rgba(20,20,18,.78); color: #fff; font-size: 15px;
    text-align: center; line-height: 1.5;
  }
  .subtitle:empty { display: none; }
  .subtitle mark { background: #ffe08a; color: #23221f; padding: 0 2px; border-radius: 3px; }

  .badge {
    position: absolute; top: 12px; left: 12px;
    background: rgba(255,255,255,.94); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 11px; font-size: 12px;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }

  .answer {
    position: absolute; left: 12px; right: 12px; bottom: 64px;
    background: #fff; border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0; padding: 10px 14px; box-shadow: 0 4px 16px rgba(0,0,0,.08);
    display: none;
  }
  .answer.show { display: block; }
  .answer .q { color: var(--muted); font-size: 12px; margin-bottom: 3px; }
  .answer .a { font-size: 15px; }
  .answer .truth { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .answer .truth:empty { display: none; }
  .row .req { color: var(--warn); }
  .answer.guide { border-left-color: var(--warn); background: var(--warn-soft); }

  .side {
    width: 380px; flex: 0 0 380px; background: var(--panel);
    border-left: 1px solid var(--line); display: flex; flex-direction: column;
    min-height: 0;
  }
  .side-head {
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 8px;
  }
  .side-head strong { font-size: 13px; }
  .side-head span { color: var(--muted); font-size: 12px; }
  .list { flex: 1; overflow-y: auto; padding: 6px 8px; overscroll-behavior: contain; }
  .row {
    display: flex; gap: 8px; align-items: flex-start;
    padding: 7px 9px; border-radius: 7px; cursor: pointer; border: 1px solid transparent;
  }
  .row:hover { background: #faf9f6; border-color: var(--line); }
  .row.active { background: var(--accent-soft); border-color: #cfe3dc; }
  .row .no { color: var(--muted); font-size: 11px; width: 20px; flex: 0 0 20px;
             text-align: right; font-variant-numeric: tabular-nums; padding-top: 2px; }
  .row .txt { flex: 1; font-size: 13px; word-break: break-word; }
  .chip {
    font-size: 10px; padding: 1px 6px; border-radius: 4px; white-space: nowrap;
    background: #f0efeb; color: var(--muted); flex: 0 0 auto; margin-top: 3px;
  }
  .chip.control { background: #eef0f4; color: #4a5a72; }
  .chip.seek    { background: #eaf2ee; color: #2f6f5e; }
  .chip.search  { background: #eef1ea; color: #556b3f; }
  .chip.highlight { background: #fdf3e3; color: #8a6321; }
  .chip.touch   { background: #f0eef6; color: #5a4e77; }
  .chip.qa      { background: #f6eeee; color: #7a4a4a; }

  footer {
    display: flex; gap: 8px; padding: 12px 16px;
    border-top: 1px solid var(--line); background: var(--panel); flex: 0 0 auto;
    align-items: center;
  }
  footer input[type=text] { flex: 1; }
  .hint { color: var(--muted); font-size: 12px; padding: 0 16px 10px; }
  .err { color: #9b3b3b; }
</style>
</head>
<body>
<header>
  <div class="brand">纸书智伴<small>本地演示</small></div>
  <select id="book"></select>
  <button id="reset" title="重置会话">重置</button>
  <div class="spacer"></div>
  <div class="meta"><span id="pagelabel">第 1 页</span> · <span id="clock">00:00</span></div>
</header>

<main>
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <img id="frame" alt="书页">
      <div class="badge" id="badge">p1</div>
      <div class="bbox" id="bbox" style="display:none"></div>
      <div class="subtitle" id="subtitle"></div>
      <div class="answer" id="answer">
        <div class="q" id="q"></div>
        <div class="a" id="a"></div>
        <div class="truth" id="truth"></div>
      </div>
    </div>
  </div>

  <div class="side">
    <div class="side-head"><strong>交互脚本</strong><span id="count"></span></div>
    <div class="list" id="list"></div>
  </div>
</main>

<footer>
  <button data-act="play">播放</button>
  <button data-act="pause">暂停</button>
  <button data-act="resume">继续</button>
  <button data-act="stop">结束</button>
  <input type="text" id="say" placeholder="说点什么，或直接点右边的脚本…（回车发送）">
  <button class="primary" id="send">发送</button>
</footer>
<div class="hint">时间轴目前由页图驱动：每页 6 秒。换成真视频时只需改取帧方式，交互代码不动。</div>

<script src="/web/app.js"></script>
</body>
</html>
