<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="/reader/favicon.svg"><title>纸书智伴 · 阅读空间</title><link rel="stylesheet" href="style.css"><body><header><strong>纸书智伴 <small>DreamyTale</small></strong><span>让每一本书，都有回应</span></header><main><aside><h2>我的绘本</h2><button id="refresh">刷新书架</button><select id="books" aria-label="选择绘本"><option value="">请选择绘本</option></select><hr><h3>上传绘本</h3><p>支持 PDF 绘本，或包含 PDF 的 ZIP。</p><input id="archive" type="file" accept=".pdf,.zip" hidden><button id="upload" type="button">上传绘本</button><button id="generate">生成视频</button><p id="job" role="status"></p></aside><section class="reader"><p class="eyebrow">一起读，一起发现</p><h1 id="title">欢迎来到故事世界</h1><div class="stage"><video id="video" controls playsinline preload="metadata" hidden></video><img id="page" alt="当前绘本页面" hidden><div id="empty">从左侧选择或上传一本绘本<br><small>生成的视频将在这里播放</small></div></div><p id="subtitle"></p><nav><button id="prev">上一页</button><span id="pageNumber">尚未选择绘本</span><button id="next">下一页</button><button id="resume">继续故事</button></nav><p id="notice" role="status" aria-live="polite">连接后端中…</p></section><aside class="chat"><h2>问问故事</h2><p>想知道什么？暂停故事，问一问。</p><div id="messages" aria-live="polite"></div><audio id="reply" controls controlslist="nodownload" hidden></audio><form id="question"><input id="text" placeholder="比如：它为什么这么做？" aria-label="问题" required><button>发送</button></form><button id="record">开始录音</button><button id="uploadAudio" type="button">上传语音</button><input id="audioFile" type="file" accept="audio/*,.wav,.mp3,.webm,.m4a,.ogg" hidden><label><input id="speak" type="checkbox" checked>自动朗读文字回答</label><button id="export">导出本次交互记录</button></aside></main><dialog id="uploadDialog" aria-labelledby="uploadTitle"><h2 id="uploadTitle">选择要导入的绘本</h2><p id="selectedArchive"></p><p>检测到多个 PDF，请选择本次要导入的一本。</p><label for="key">ZIP 中的绘本</label><select id="key"></select><div class="dialogActions"><button id="cancelUpload" type="button">取消</button><button id="confirmUpload" type="button">导入这本绘本</button></div></dialog><script type="module" src="src/app.js"></script></body></html>
