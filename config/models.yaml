# Model providers. Change this file to swap models; pipeline code stays the same.
# Free/local defaults: RapidOCR for OCR, local Ollama for VLM.

ocr:
  provider: rapidocr
  fallback: [null]
  rapidocr:
    max_side: 1600
  # Rasterized watermark text on the competition samples. OCR fragments that
  # mostly reuse these characters are rejected as boilerplate.
  watermark_phrases:
    - "仅供第二届北京市大学生人工智能创新大赛纸书智伴赛题参赛使用请勿外传"

vlm:
  # Local LM Studio first: nothing leaves the machine. If it is not running,
  # the stage degrades to manual (human written) narratives instead of failing.
  provider: openai_compatible
  fallback: [ollama, null]
  # LM Studio, local server on 1234. qwen3.5-9b is the multimodal build
  # (it ships a mmproj), so one model serves both page understanding and the
  # story/scene text work.
  openai_compatible:
    base_url: http://127.0.0.1:1234/v1
    model: qwen/qwen3.5-9b
    api_key_env: LMSTUDIO_API_KEY
    timeout: 240
    max_tokens: 768
    temperature: 0.1
    # qwen3.5 是推理模型，默认会把 token 全花在 thinking 上并返回空答案；
    # 关掉推理后单页从 47s 降到 4s。
    reasoning_effort: none
    # Page PNGs are ~2600px wide; 1024 keeps the vision tokens (and VRAM)
    # small enough for a laptop.
    max_side: 1024
  # Ollama is the fallback if LM Studio is not up.
  ollama:
    base_url: http://127.0.0.1:11434
    model: qwen2.5vl:7b
    timeout: 120
    temperature: 0.1
    keep_alive: 10m

# Future stages use the same pattern:
# tts:   { provider: edge_tts }
i2v:
  # 字节系图生视频（火山方舟 v3 / 豆包 Seedance 等）。模型 ID 以控制台为准，
  # 用 ARK_MODEL_ID 传，不写死在仓库里。
  # 没配 key/model 时 video 阶段自动退回页动画，并在 manifest 里标降级。
  provider: volcengine_ark
  fallback: [null]

  # 0 = 不启用；100 = 所有场景都走 I2V（成本/耗时最高）。
  # 演示建议先设 2–4 个 hero scene，或在 scene_ids 里点名。
  max_scenes: 100
  scene_ids: []

  volcengine_ark:
    base_url: https://ark.cn-beijing.volces.com/api/v3
    api_key_env: ARK_API_KEY
    model_env: ARK_MODEL_ID
    model: ""
    create_path: /contents/generations/tasks
    query_path: /contents/generations/tasks/{task_id}
    timeout: 900
    poll_interval: 5
    image_mode: data_url
    image_first: false
    ratio: adaptive
    extra: {}

# Story and scene planning: text only, same local endpoint as the VLM.
llm:
  provider: openai_compatible
  fallback: [null]
  openai_compatible:
    base_url: http://127.0.0.1:1234/v1
    model: qwen/qwen3.5-9b
    api_key_env: LLM_API_KEY
    timeout: 240
    max_tokens: 900
    temperature: 0.2
    reasoning_effort: none

# Speech input. The model runs locally; CUDA is used when the runtime DLLs are
# present (LM Studio ships cuBLAS 12) and the provider falls back to CPU int8.
# `language: auto` matters: the official scripts mix Chinese controls with
# English questions, even inside an English book.
asr:
  provider: faster_whisper
  fallback: [null]
  # 低于这个平均 token 概率就不猜，改成'我听到的是……，请再说一遍'。
  confirm_below: 0.45
  faster_whisper:
    model: D:/LLM/models/faster-whisper/small
    device: auto
    compute_type: auto
    cpu_threads: 4
    beam_size: 5
    # The clips are short commands; trimming silence only loses words.
    vad_filter: false
    language: auto
